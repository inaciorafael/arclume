name: Prerelease

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag_name:
        description: Tag da release que recebera os instaladores
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  publish:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Validate release metadata
        run: |
          npm run inventory
          npm run release:preflight
          npm run license:audit

      - name: Build and publish unsigned prerelease bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: Arclume v__VERSION__
          releaseBody: |
            First public Arclume preview.

            These packages are unsigned prerelease builds. Windows may show a SmartScreen warning and macOS may require explicit approval in Privacy & Security. Do not treat them as signed production distributions.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          releaseCommitish: ${{ github.sha }}
